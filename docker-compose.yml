version: '3.8'

services:
  db:
    image: postgres:16
    container_name: bt_sn_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourSecurePassword123
      POSTGRES_DB: bt_sn_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bt_sn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bt_sn_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pharma.com
      PGADMIN_DEFAULT_PASSWORD: AdminPassword123!
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped

  web:
    build: .
    container_name: bt_sn_portal
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://postgres:YourSecurePassword123@db:5432/bt_sn_db
      API_KEY: BT_SN_PORTAL_SECRET_KEY_123
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
